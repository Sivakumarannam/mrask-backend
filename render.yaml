services:
  - type: web
    name: mrask-backend
    env: python
    buildCommand: pip install -r requirements.txt && python manage.py migrate && python manage.py collectstatic --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "mrask-backend.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://mrask-frontend.vercel.app"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://mrask-backend.onrender.com,https://mrask-frontend.vercel.app"
      - key: DATABASE_URL
        fromDatabase:
          name: mrask-db
          property: connectionString
      # Email — set these in the Render dashboard (Environment tab)
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: CONTACT_EMAIL_TO
        sync: false

databases:
  - name: mrask-db
    plan: free
    postgresMajorVersion: 16
